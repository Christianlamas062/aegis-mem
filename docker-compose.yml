services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: aegis-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  aegis-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aegis-mem-api
    ports:
      - "8000:8000"
    environment:
      - AEGIS_QDRANT_HOST=qdrant
      - AEGIS_QDRANT_PORT=6333
      - AEGIS_COLLECTION_NAME=aegis_procedural_rules
      - AEGIS_LLM_PROVIDER=${AEGIS_LLM_PROVIDER:-openai}
      - AEGIS_LLM_MODEL=${AEGIS_LLM_MODEL:-gpt-4o-mini}
      - AEGIS_LLM_API_KEY=${AEGIS_LLM_API_KEY:-}
      - AEGIS_TELEMETRY_DB_PATH=/app/data/aegis_telemetry.sqlite
    volumes:
      - aegis_data:/app/data
    depends_on:
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

volumes:
  qdrant_storage:
  aegis_data:
