[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aegis-mem"
version = "0.1.0"
description = "Self-Evolving Procedural & Episodic Agent Memory Engine powered by Mem0 + Qdrant"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mem0ai>=0.1.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "fastmcp>=0.2.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "qdrant-client>=1.9.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/aegis_mem"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]

